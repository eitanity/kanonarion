# Default depth policy - equivalent to running kanonarion with no policy file.
# All dependencies are traversed without limit; replace directives are
# honoured; indirect requirements are followed.
version: "1"

stages:
  fetch:
    # max_depth: 0 means unlimited - traverse the full transitive closure.
    max_depth: 0

    # follow_replace: apply replace directives from the target's go.mod.
    # Set to false in strict reproducibility environments where replace
    # directives should be ignored (see strict.yaml).
    follow_replace: true

    # follow_test: include test-only dependencies. Currently a no-op because
    # go.mod carries no explicit test-only marker; reserved for future use.
    follow_test: false

    # follow_indirect: follow requirements marked // indirect in go.mod.
    # In Go 1.17+, indirect requirements include transitive dependencies of
    # direct deps. Setting false restricts the graph to direct imports only.
    follow_indirect: true

    # allowed_vcs_hosts: the forges the fetch stage may clone from when
    # cross-verifying a module's repository against its proxy zip. Omitted
    # here, which means the built-in set applies:
    #
    #   bitbucket.org  codeberg.org  github.com
    #   gitlab.com     go.googlesource.com  gopkg.in
    #
    # Unlike the booleans above, this field keys on PRESENCE, not on its zero
    # value: omitting it leaves the built-in set in force rather than emptying
    # the list, so an unrelated edit to this stage can never silently weaken
    # verification. Setting it replaces the built-in set wholesale (it does not
    # merge). An explicitly empty list is a load error - to turn the git leg off
    # entirely use --skip-vcs-verify, which still runs checksum verification.
    # The key belongs to the fetch stage only (that is where cross-verification
    # runs); under any other stage it is a load error rather than a silent no-op.
    #
    # allowed_vcs_hosts:
    #   - github.com
    #   - git.example.org
