version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - contextcheck
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - nilerr
    - staticcheck
    - wrapcheck

  settings:
    errcheck:
      # Plan requires zero exclusions, so no exclude-functions. Unchecked type
      # assertions and errors assigned to _ are reported too.
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    wrapcheck:
      # Only errors from outside this module need wrapping.
      ignore-package-globs:
        - code.eitanity.com/kanonarion/*
    gocyclo:
      min-complexity: 15
    forbidigo:
      # Wall-clock access in the application or domain layer must go through
      # the injected Clock (record timestamps) or Stopwatch (latency metrics),
      # never a direct time.Now/time.Since read. Scoped by the rules below.
      forbid:
        - pattern: '^time\.Now$'
          msg: "no time.Now() in application/domain — inject clock.Clock (record timestamps) or a Stopwatch (latency)"
        - pattern: '^time\.Since$'
          msg: "no time.Since() in application/domain — measure elapsed time via an injected Stopwatch"

  exclusions:
    # Skip files whose header comment marks them generated, as before v2.
    # No file in the repo carries such a header today.
    generated: lax
    # The four presets golangci-lint applied by default before v2. Kept on
    # explicitly so the policy stays the one the project has always declared.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # forbidigo applies ONLY to the application and domain layers. Wall-clock
      # reads are legitimate in adapters, the CLI, cmd and tests. Path segments
      # are exact, so internal/<ctx>/application and internal/<ctx>/domain are
      # never excluded while every adapters/cli/cmd path is.
      - linters: [forbidigo]
        path: '(^|/)(adapters|cli|cmd)(/|$)'
      - linters: [forbidigo]
        path: '_test\.go$'

# gofmt is a formatter, not a linter, so it lives in its own section. Nothing
# else in the project checks layout, so unformatted code could otherwise reach
# a commit. `golangci-lint fmt` rewrites; `golangci-lint run` reports.
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
