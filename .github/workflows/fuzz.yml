name: Fuzz

# Continuous fuzzing. The in-tree f.Add seeds are the
# persistent seed corpora; any crasher Go discovers is written to
# testdata/fuzz/<FuzzName>/<id>. Download the crasher artifact, commit it, and
# the existing `test` job replays it forever as a regression case.

on:
  schedule:
    # 03:17 UTC daily — off-peak, avoids the top-of-hour runner contention.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz budget (Go duration, e.g. 5m)"
        required: false
        default: "5m"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no token scopes by default; each job opts into exactly what
# it needs. Third-party actions pinned to full commit SHAs (trailing '# vX' is
# the tag the SHA resolved from) so a moved tag cannot change what runs.
permissions: {}

jobs:
  discover:
    name: Discover fuzz packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        name: Enumerate packages with fuzz targets
        run: |
          set -euo pipefail
          pkgs=$(git grep -l '^func Fuzz' -- '*_test.go' \
            | xargs -n1 dirname | sort -u | sed 's#^#./#')
          json=$(printf '%s\n' "$pkgs" | jq -R . | jq -cs '{pkg: .}')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Fuzzing packages:" && printf '%s\n' "$pkgs"

  fuzz:
    name: Fuzz ${{ matrix.pkg }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run every fuzz target in the package
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '5m' }}
          PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          # The list runs outside the for so its exit status is checked: a
          # package that does not compile must fail, not fuzz nothing and pass.
          if ! list=$(go test -list '^Fuzz' "$PKG"); then
            echo "::error::go test -list failed in $PKG"
            exit 1
          fi
          fns=$(printf '%s\n' "$list" | grep '^Fuzz' || true)
          if [ -z "$fns" ]; then
            echo "::error::no Fuzz targets listed in $PKG"
            exit 1
          fi
          failed=""
          for fn in $fns; do
            echo "::group::$PKG $fn (fuzztime=$FUZZTIME)"
            if ! go test -run='^$' -fuzz="^$fn$" -fuzztime="$FUZZTIME" \
                -test.timeout=20m "$PKG"; then
              failed="$failed $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz failures in $PKG:$failed"
            exit 1
          fi

      - name: Upload discovered crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
